apiVersion: v1
kind: Service
metadata:
  name: grip-sample
spec:
  type: ClusterIP            # 종류는 다른 옵션도 있음 (아래 설명)
  selector:
    app: grip-sample         # ← Deployment의 Pod 라벨과 동일하게
  ports:
    - port: 80               # ← Service가 받는 포트 (외부 진입)
      targetPort: 8080       # ← Pod 안 컨테이너의 포트